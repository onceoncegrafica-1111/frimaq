    <!-- Tipografía Corporativa: Montserrat -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Configuración del ADN Visual -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#284766',  // Extraído matemáticamente del SVG (st0)
                            light: '#2688BB', // Extraído matemáticamente del SVG (st1)
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 24s linear infinite', // Animación de 24s (Estilo Industrial/Maquinaria)
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Optimizaciones B2B y Motor de Animación */
        body { 
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            background-color: #f0f4f8;
        }

        /* Cryo-Mesh Gradient: Efecto visual de aire frío */
        .cryo-mesh-bg {
            background: linear-gradient(-45deg, #e2eaf4, #ffffff, #c9dff0, #d5e6f5);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism de Alta Fidelidad */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(40, 71, 102, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
