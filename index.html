    <!-- Optimización de Conexiones Previas (Velocidad de Carga) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Motor de renderizado) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración del ADN Visual -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#284766',  
                            light: '#2688BB', 
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Optimizaciones B2B y Comportamiento Táctil */
        body { 
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            background-color: #f0f4f8;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* IDENTIDAD VISUAL DEL QR: Círculos geométricos sutiles */
        body::before, body::after {
            content: '';
            position: fixed;
            border: 1.5px solid rgba(38, 136, 187, 0.16);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            box-shadow: inset 0 0 50px rgba(38, 136, 187, 0.03);
        }

        body::before {
            width: 320px;
            height: 320px;
            top: -110px;
            left: -110px;
        }

        body::after {
            width: 480px;
            height: 480px;
            bottom: -160px;
            right: -160px;
        }

        /* Cryo-Mesh Gradient: Acelerado por GPU sin repintados de CPU */
        .cryo-mesh-bg {
            position: fixed;
            inset: -20px;
            background: 
                radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.88) 0%, transparent 50%),
                radial-gradient(circle at 82% 82%, rgba(198, 222, 241, 0.65) 0%, transparent 55%),
                linear-gradient(135deg, #e3ecf5 0%, #f6f9fc 50%, #d8e8f5 100%);
            z-index: -2;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            animation: gradientDrift 18s ease-in-out infinite alternate;
        }

        @keyframes gradientDrift {
            0% { transform: scale(1) translate3d(0, 0, 0); }
            100% { transform: scale(1.04) translate3d(-10px, 10px, 0); }
        }

        /* Glassmorphism de Alta Fidelidad - Reflejo biselado y contraste profesional */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.52) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 
                0 1px 3px rgba(40, 71, 102, 0.03),
                0 10px 28px -4px rgba(40, 71, 102, 0.08),
                inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.95);
            transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.2s ease,
                        background 0.2s ease;
            will-change: transform, box-shadow;
        }

        .glass-card:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.68) 100%);
            border-color: rgba(38, 136, 187, 0.45);
            transform: translateY(-2.5px);
            box-shadow: 
                0 2px 6px rgba(40, 71, 102, 0.04),
                0 16px 34px -4px rgba(38, 136, 187, 0.16),
                inset 0 1px 2px 0 rgba(255, 255, 255, 1);
        }

        .glass-card:active {
            transform: scale(0.985) translateY(0);
            box-shadow: 0 4px 14px rgba(40, 71, 102, 0.08);
        }

        /* ==========================================================================
           SISTEMA DE PARTÍCULAS: ACELERADO POR COMPOSITOR GPU (60/120 FPS FLUIDO)
           ========================================================================== */
        @keyframes cryoFloat {
            0% { 
                transform: translate3d(0, -10vh, 0) rotate(0deg); 
                opacity: 0; 
            }
            12% { 
                opacity: 0.13; 
            }
            50% { 
                transform: translate3d(24px, 50vh, 0) rotate(180deg); 
                opacity: 0.13; 
            }
            88% { 
                opacity: 0.13; 
            }
            100% { 
                transform: translate3d(-16px, 110vh, 0) rotate(360deg); 
                opacity: 0; 
            }
        }

        .cryo-particle {
            position: absolute;
            color: #2688BB; 
            pointer-events: none; 
            opacity: 0; 
            will-change: transform, opacity;
            animation: cryoFloat linear infinite;
        }

        .particle-1 { left: 14vw; top: -10vh; width: 60px; height: 60px; animation-duration: 24s; animation-delay: 0s; }
        .particle-2 { left: 46vw; top: -10vh; width: 30px; height: 30px; animation-duration: 20s; animation-delay: 4s; }
        .particle-3 { left: 82vw; top: -10vh; width: 62px; height: 62px; animation-duration: 28s; animation-delay: 2s; }
        .particle-4 { left: 8vw;  top: -10vh; width: 32px; height: 32px; animation-duration: 18s; animation-delay: -6s; }
        .particle-5 { left: 66vw; top: -10vh; width: 58px; height: 58px; animation-duration: 26s; animation-delay: -14s; }
        .particle-6 { left: 28vw; top: -10vh; width: 30px; height: 30px; animation-duration: 22s; animation-delay: -20s; }
    </style>
</head>
